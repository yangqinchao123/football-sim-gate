name: football-gates

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all gate scripts (syntax gate)
        run: |
          python -m py_compile gates/*.py lib/*.py
          echo "All gate scripts compile."

      - name: Secret leak guard (fail if secrets staged)
        run: |
          if grep -rInE "(TQ_PW=|password\s*=|BEGIN .*PRIVATE KEY)" gates lib framework 2>/dev/null; then
            echo "::error::检测到疑似密钥/密码，禁止合并"
            exit 1
          fi
          echo "No hardcoded secrets."

      - name: Gate smoke test
        run: python gates/smoke_test.py
