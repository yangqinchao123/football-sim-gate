name: football-gates

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all gate scripts (syntax gate)
        run: |
          python -m py_compile gates/*.py lib/*.py
          echo "All gate scripts compile."

      - name: Secret leak guard (fail if secrets staged)
        run: |
          if grep -rInE "(TQ_PW=|password\s*=|BEGIN .*PRIVATE KEY)" gates lib framework daily 2>/dev/null; then
            echo "::error::检测到疑似密钥/密码，禁止合并"
            exit 1
          fi
          echo "No hardcoded secrets."

      - name: Gate smoke test
        run: python gates/smoke_test.py

      # 关键：门禁必须真的"判定"，不能只编译。对本次变更涉及的每个批次，
      # 重算 S0..goal 全部阶段，任一 BLOCK 即红叉、不可合并。
      - name: Stage gate verify (批次状态机)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "非 PR 事件，跳过批次校验"; exit 0
          fi
          # 不用 --depth=1：浅取会丢 merge-base，导致 diff 为空、闸门被静默跳过（D42 首轮即此故障）
          git fetch --no-tags origin "$BASE_SHA" || { echo "::error::无法取到 base sha"; exit 1; }
          # core.quotePath=false：中文路径默认会被转义成 "daily/...\346\225..."，导致 ^daily/ 匹配不上（D42 第二轮故障）
          CHANGED=$(git -c core.quotePath=false diff --name-only "$BASE_SHA"..."$HEAD_SHA") || { echo "::error::git diff 失败，按失败处理"; exit 1; }
          echo "变更文件数: $(echo "$CHANGED" | grep -c . || true)"; echo "$CHANGED" | head -20
          BATCHES=$(echo "$CHANGED" | grep -E '^daily/' | cut -d/ -f2 | sed 's/.*_//' | sort -u || true)
          if [ -z "$BATCHES" ]; then echo "本次变更不涉及批次产物（infra-only PR）"; exit 0; fi
          for B in $BATCHES; do
            echo "===== 校验批次 $B ====="
            python gates/stage_gate.py "$B" verify
          done
          echo "Stage gate verify: 全部批次达到声明目标"
