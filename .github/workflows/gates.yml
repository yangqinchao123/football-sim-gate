name: football-gates

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Workflow pin check (action 必须 pin 到 40 位 SHA)
        run: |
          python tools/check_pins.py
          python tools/check_pins.py --selftest

      - name: Compile all gate scripts (syntax gate)
        run: |
          python -m py_compile gates/*.py lib/*.py
          echo "All gate scripts compile."

      - name: Secret leak guard (fail if secrets staged)
        run: |
          if grep -rInE "(TQ_PW=|password\s*=|BEGIN .*PRIVATE KEY)" gates lib framework daily 2>/dev/null; then
            echo "::error::检测到疑似密钥/密码，禁止合并"
            exit 1
          fi
          echo "No hardcoded secrets."

      - name: Gate smoke test
        run: python gates/smoke_test.py

      # 反向用例：漏洞必须被拦。改闸门不验证"拦不拦得住"，等于没改。
      - name: Gate regression test (反向用例必须 BLOCK)
        run: python gates/regression_test.py

      - name: Calibration map check (校准表结构+单调性)
        run: python lib/calib_check.py

      - name: Direction ledger check (命中台账可复算)
        run: python tools/ledger.py validate

      # 关键：门禁必须真的"判定"，不能只编译。对本次变更涉及的每个批次，
      # 重算 S0..goal 全部阶段，任一 BLOCK 即红叉、不可合并。
      - name: Stage gate verify (批次状态机)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "非 PR 事件（main 已由分支保护强制走 PR，此处仅记录）"; exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA" || { echo "::error::无法取到 base sha"; exit 1; }
          CHANGED=$(git -c core.quotePath=false diff --name-only "$BASE_SHA"..."$HEAD_SHA") || { echo "::error::git diff 失败，按失败处理"; exit 1; }
          echo "变更文件数: $(echo "$CHANGED" | grep -c . || true)"; echo "$CHANGED" | head -20
          B1=$(echo "$CHANGED" | grep -E '^daily/' | cut -d/ -f2 | sed 's/.*_//' || true)
          B2=$(echo "$CHANGED" | grep -vE '^daily/' | awk -F/ '{print $NF}' | grep -oE '^(g0)?D[0-9]+_' | sed 's/^g0//; s/_$//' || true)
          BATCHES=$(printf "%s\n%s\n" "$B1" "$B2" | grep -E '^D[0-9]+$' | sort -u || true)
          if [ -z "$BATCHES" ]; then echo "本次变更不涉及批次产物（infra-only PR）"; exit 0; fi
          for B in $BATCHES; do
            echo "===== 校验批次 $B ====="
            GOAL=$(python3 tools/goal_of.py "$BASE_SHA" "$B")
            echo "目标阶段 $GOAL（base/head 取高，防 PR 自行降标）"
            python3 gates/stage_gate.py "$B" verify --goal "$GOAL" || { echo "::error::批次 $B 未达到 $GOAL"; exit 1; }
          done
          echo "Stage gate verify: 全部批次达到声明目标"
